<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Una sorpresa para ti</title>

    <link rel="stylesheet" href="css/estilos.css">

    <script src="js/script.js" defer></script>
</head>

<body>

    <main class="pantalla-inicio">

        <section class="contenedor-clave">

            <h1>Ingresa la clave</h1>

            <p class="pista">
                Pista: aquí colocaremos una pista para la contraseña.
            </p>

            <div class="casillas-clave">
                <input type="password" maxlength="1" readonly>
                <input type="password" maxlength="1" readonly>
                <input type="password" maxlength="1" readonly>
                <input type="password" maxlength="1" readonly>
            </div>

            <div class="teclado-numerico">

                <button type="button" data-numero="1">1</button>
                <button type="button" data-numero="2">2</button>
                <button type="button" data-numero="3">3</button>

                <button type="button" data-numero="4">4</button>
                <button type="button" data-numero="5">5</button>
                <button type="button" data-numero="6">6</button>

                <button type="button" data-numero="7">7</button>
                <button type="button" data-numero="8">8</button>
                <button type="button" data-numero="9">9</button>

                <button type="button" id="borrar">Borrar</button>
                <button type="button" data-numero="0">0</button>
                <button type="button" id="aceptar">Aceptar</button>

            </div>

        </section>

    </main>

    <div class="ventana-error" id="ventanaError">

        <div class="contenido-error">

            <img
                src="imagenes/snoopyerror.jpg"
                alt="Snoopy triste"
            >

            <h2>Clave incorrecta</h2>

            <p>Intenta de nuevo tonta jaja :c </p>

            <button type="button" id="cerrarError">
                Volver a intentar
            </button>

        </div>

    </div>

</body>

</html>
